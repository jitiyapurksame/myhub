<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#faf9f7;--card:#fff;--tx:#3d4047;--mut:#9a9ca3;--bd:#eceae6;--acc:#8ea7e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1b1e;--card:#242529;--tx:#e6e5e1;--mut:#8b8d94;--bd:#33343a}}
:root[data-theme="dark"]{--bg:#1a1b1e;--card:#242529;--tx:#e6e5e1;--mut:#8b8d94;--bd:#33343a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:18px 14px}
h1{font-size:20px;font-weight:600;margin:4px 0 14px;letter-spacing:.2px}
.tabs{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.tab,.btn,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 16px;font:inherit;cursor:pointer}
.tab.on,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{white-space:nowrap;padding:5px 13px;font-size:13px}
.chip.on{color:#3d4047;border-color:transparent;font-weight:600}
.sec{margin:20px 0 8px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.app{position:relative;background:var(--c);border-radius:18px;padding:14px;text-decoration:none;color:#3d4047;display:block;min-height:108px;transition:transform .15s}
.app:hover{transform:translateY(-2px)}
.app .ic{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:#4f5565}
.app b{display:block;margin-top:8px;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.app small{opacity:.7;display:block;font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.ed{position:absolute;top:6px;right:8px;border:0;background:transparent;color:#3d4047;opacity:.45;font-size:15px;cursor:pointer;padding:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:110px}
.note{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px}
.note h3{margin:0 0 2px;font-size:15px;font-weight:600}
.note p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.note time{color:var(--mut);font-size:12px}
.note.c{background:var(--c);border-color:transparent;color:#3d4047}
.note.c time{color:#3d4047;opacity:.6}
.note.c .btn{background:rgba(255,255,255,.65);border-color:transparent;color:#3d4047}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;opacity:.8}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar select{width:auto;flex:none}
.fold{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;user-select:none}
.fold b{font-weight:600;flex:1;overflow-wrap:anywhere}
.fold .n{color:var(--mut);font-size:12px}
.fold .chev{display:inline-block;transition:transform .15s;color:var(--mut)}
.fold.open .chev{transform:rotate(90deg)}
.fold .ed{position:static}
.fold.c{background:var(--c);border-color:transparent;color:#3d4047}
.fold.c span{color:#3d4047!important}
.fold.c .n,.fold.c .chev{opacity:.6}
.fold.c .ed{color:#3d4047}
.dots{display:flex;gap:4px;align-items:center}
.fbody{margin:0 0 8px 8px;padding-left:10px;border-left:2px solid var(--bd)}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.imgs img{width:96px;height:96px;object-fit:cover;border-radius:12px;cursor:zoom-in}
.ov{position:fixed;inset:0;background:rgba(40,42,50,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.show{display:flex}
.box{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.box label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mut)}
.icons{display:flex;flex-wrap:wrap;gap:4px}
.icons button{border:1.5px solid transparent;background:var(--bg);color:var(--mut);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icons .gl{flex-basis:100%;font-size:11px;color:var(--mut);margin:10px 0 2px;letter-spacing:.5px}
.icons button .e{font-size:21px;line-height:1}
.icons button.on{border-color:var(--acc);color:var(--acc);background:var(--card)}
.msg{color:var(--mut);text-align:center;padding:36px 10px}
.thumb{position:relative;display:inline-block}
.thumb button{position:absolute;top:-6px;right:-6px;border-radius:50%;border:0;background:#e88f8f;color:#fff;width:22px;height:22px;cursor:pointer}
.del{color:#d97777}
.pin{text-align:center;font-size:22px;letter-spacing:8px;margin-top:10px}
.chip.k.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lnk{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0}
#big{max-width:96%;max-height:90%;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span id="ttl">My Hub</span> <button class="ed" id="ren" aria-label="Rename" style="position:static;font-size:14px">✎</button></h1>
  <div class="tabs">
    <button class="tab on" id="t-apps">Apps</button>
    <button class="tab" id="t-notes">Notes</button>
    <span style="flex:1"></span>
    <button class="btn pri" id="add">+ Add</button>
  </div>
  <div id="v-apps">
    <input id="q" placeholder="Search..." style="margin-bottom:10px">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </div>
  <div id="v-notes" style="display:none">
    <div class="bar">
      <input id="nq" placeholder="Search notes..." style="flex:1">
      <select id="nsort" aria-label="Sort notes">
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>
    <div class="chips" id="nchips"></div>
    <div id="nlist"></div>
  </div>
  <div style="text-align:center"><button class="btn" id="out" style="font-size:12px;padding:4px 12px;color:var(--mut)">Sign out</button></div>
  <div id="warn" class="msg" style="display:none">Could not connect. Check the Supabase URL and key in index.html.</div>
</div>

<div class="ov" id="ovL"><div class="box">
  <h2 id="lt" style="margin:0;font-size:18px">Add app</h2>
  <label>Name</label><input id="ln">
  <label>URL</label><input id="lu" inputmode="url" placeholder="https://...">
  <label>Description</label><input id="ld">
  <label>Category</label><select id="lc"></select>
  <label>Icon</label><div class="icons" id="li"></div>
  <div class="row" style="margin-top:18px">
    <button class="btn pri" id="ls">Save</button>
    <button class="btn" id="lx">Cancel</button>
    <span style="flex:1"></span>
    <button class="btn del" id="ldel" style="display:none">Delete</button>
  </div>
</div></div>

<div class="ov" id="ovN"><div class="box">
  <h2 id="nt" style="margin:0;font-size:18px">New note</h2>
  <label>Title</label><input id="nn">
  <label>Category</label><select id="ncat"></select>
  <label>Folder (collapsed by default in the list)</label><select id="nfold"></select>
  <input id="nfnew" placeholder="New folder name" maxlength="40" style="display:none;margin-top:6px">
  <label>Text</label><textarea id="nx"></textarea>
  <label>Attach images</label>
  <input type="file" id="nf" accept="image/*" multiple>
  <div class="imgs" id="np"></div>
  <div class="row" style="margin-top:18px">
    <button class="btn pri" id="ns">Save</button>
    <button class="btn" id="nc">Cancel</button>
    <span style="flex:1"></span>
    <button class="btn del" id="ndel" style="display:none">Delete</button>
  </div>
</div></div>

<div class="ov" id="ovP" style="align-items:center"><div class="box" style="border-radius:24px;margin:14px">
  <h2 style="margin:0;font-size:18px">Welcome</h2>
  <label>Your name (shown as the page title)</label><input id="pn" maxlength="30">
  <div class="row" style="margin-top:18px">
    <button class="btn pri" id="ps">Save</button>
    <button class="btn" id="pk">Skip</button>
  </div>
</div></div>

<div class="ov" id="ovA" style="align-items:center"><div class="box" style="border-radius:24px;margin:14px">
  <h2 style="margin:0;font-size:18px">Sign in</h2>
  <label>Email</label><input id="ae" type="email" autocomplete="username">
  <label>Password</label><input id="ap" type="password" autocomplete="current-password">
  <div id="aerr" style="color:#d97777;font-size:13px;margin-top:8px"></div>
  <div class="row" style="margin-top:14px"><button class="btn pri" id="ain">Sign in</button></div>
</div></div>

<div class="ov" id="ovK" style="align-items:center"><div class="box" style="border-radius:24px;margin:14px"><h2 id="kt" style="margin:0;font-size:18px"></h2><div id="kb"></div></div></div>

<div class="ov" id="ovI" style="align-items:center"><img id="big" alt=""></div>

<script>
/* [stored key (kept for existing data), English label, pastel, dot] */
const CATS=[["งาน","Work","#dbe6fb","#8ea7e9"],["ส่วนตัว","Personal","#e8dff5","#b79ddb"],["ครอบครัว","Family","#fbdfe5","#ee9fb2"],["สุขภาพ","Health","#dcf1e3","#8fcba6"],["ไลฟ์สไตล์","Lifestyle","#fde7d3","#f2b783"],["ลูก ๆ","Kids","#d8f0f3","#86c9d3"],["การศึกษา","Education","#fbf0cc","#e6cb70"]];
const IC={chart:"M4 20V10M10 20V4M16 20v-7M22 20H2",trend:"M3 17l6-6 4 4 8-8M15 7h6v6",scale:"M12 3v18M6 21h12M5 7h14M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z",bank:"M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18",doc:"M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7",briefcase:"M3 8h18v12H3zM9 8V5h6v3M3 13h18",note:"M5 3h14v18H5zM9 8h6M9 12h6M9 16h3",calendar:"M4 6h16v15H4zM4 11h16M8 3v4M16 3v4",coin:"M12 3a9 9 0 100 18 9 9 0 000-18zM14.5 9.5H11a1.5 1.5 0 000 3h2a1.5 1.5 0 010 3H9.5M12 7v2M12 16v2",home:"M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6",family:"M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3 3-5 6-5s6 2 6 5M17 11a2.5 2.5 0 100-5M21 19c0-2-1.5-3.5-3.5-4",heart:"M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z",activity:"M3 12h4l3-8 4 16 3-8h4",apple:"M12 7c-2-2-7-1-7 5 0 4 3 8 5 8 1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-6-5-7-7-5zM12 7c0-2 1-3 3-4",leaf:"M5 19c0-9 5-14 14-14 0 9-5 14-14 14zM5 19l8-8",cart:"M3 4h3l2 12h10l2-8H7M9 20.5h.01M17 20.5h.01",plane:"M2 12l20-8-8 18-3-8z",music:"M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z",game:"M3 9h18v8a2 2 0 01-2 2H5a2 2 0 01-2-2zM8 12v4M6 14h4M16 13h.01M18 15h.01",book:"M4 4h7a2 2 0 012 2v14a2 2 0 00-2-2H4zM20 4h-7a2 2 0 00-2 2v14a2 2 0 012-2h7z",calc:"M5 3h14v18H5zM8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01",flask:"M9 3h6M10 3v6L4 19a1 1 0 001 2h14a1 1 0 001-2l-6-10V3M7 15h10",globe:"M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18",pencil:"M4 20l1-4L16 5l3 3L8 19zM14 7l3 3",palette:"M12 3a9 9 0 100 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 003-3c0-6-4-11-8-11zM8 11h.01M12 8h.01M16 10h.01",bulb:"M9 18h6M10 21h4M12 3a6 6 0 00-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 00-4-10z",wrench:"M14 6a4 4 0 005 5l-9 9a2.1 2.1 0 01-3-3l9-9a4 4 0 01-2-2z",camera:"M3 8h4l2-3h6l2 3h4v12H3zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z",star:"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",link:"M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"};
const KEYS=Object.keys(IC);
const OLD={"📊":"chart","📈":"trend","⚖":"scale","🏛":"bank","📑":"doc","💼":"briefcase","📝":"note","📅":"calendar","💰":"coin","🏠":"home","👨‍👩‍👧":"family","❤":"heart","🏃":"activity","🍎":"apple","🧘":"leaf","🛒":"cart","✈":"plane","🎵":"music","🎮":"game","📚":"book","🧮":"calc","🔬":"flask","🌏":"globe","✏":"pencil","🎨":"palette","🧠":"bulb","🔧":"wrench","📷":"camera","⭐":"star","🔗":"link"};
const EMO=[
["Animals","🐶🐱🐭🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐤🦆🦉🦄🐴🐢🐍🐙🦀🐠🐬🐳🦈🐝🦋🐞🐘🦒🐊🦖🐑🐺".match(/\p{Extended_Pictographic}/gu)],
["Faces","😀😄😊😍🥰😎🤩😴🤔😢😭😡🥳😜🤗😱😇🤓🤖👻".match(/\p{Extended_Pictographic}/gu)],
["Vehicles","🚗🚕🚌🚓🚑🚒🚜🚲🛵🚂🚆🚁🚀🛸🚛🚧".match(/\p{Extended_Pictographic}/gu)],
["Sailing","⛵🚤🛶🚢⚓🌊🐚🧭🦜🚣🔱🌴🦭🧜".match(/\p{Extended_Pictographic}/gu)],
["School","🏫🎓🎒📏📐🧪🧩🔢🔤📓📕📗📘📙🏆🥇🔔💡🧲🎯".match(/\p{Extended_Pictographic}/gu)],
["Stars & Space","🌟💫✨🌙🌛🌞🌍🌎🪐🌠🌌🔭👽👾🌑🌕🌈⚡🌃".match(/\p{Extended_Pictographic}/gu)],
["Food","🍕🍔🍟🌭🍿🍩🍪🎂🍰🧁🍫🍬🍭🍦🍧🍉🍌🍇🍓🍒🍑🍍🥭🥝🍊🍋🥕🌽🥦🍞🧀🍳🥞🍜🍣🍙🍚🍱🥟🍤🥤🧋☕🍼".match(/\p{Extended_Pictographic}/gu)],
["Music","🎶🎤🎧🎸🎹🥁🎺🎷🎻📻🎼🎭".match(/\p{Extended_Pictographic}/gu)],
["Nature","🌳🌲🌵🌱🌿🍀🍁🍂🌸🌹🌺🌻🌼🌷🍄🌾💐🌋🌄🌅🔥💧⛄☔🐾".match(/\p{Extended_Pictographic}/gu)]
];
const EMOALL=EMO.flatMap(g=>g[1]);
const ik=v=>{v=(v||"").replace(/\uFE0F/g,"");return IC[v]?v:(OLD[v]||(EMOALL.includes(v)?v:"link"))};
const svg=v=>{const k=ik(v),s=document.createElement("span");
  if(!IC[k]){s.className="e";s.textContent=k;s.style.cssText="font-size:22px;line-height:1";return s}
  s.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[k]+'"/></svg>';return s};
const $=id=>document.getElementById(id);
const svg_p=p=>{const s=document.createElement("span");s.style.cssText="display:inline-flex;color:var(--mut)";s.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>';return s};
const E=(t,p={},...k)=>{const e=document.createElement(t);for(const a in p){if(a==="text")e.textContent=p[a];else if(a.startsWith("on"))e[a]=p[a];else e.setAttribute(a,p[a])}k.forEach(c=>e.append(c));return e};
let db=null,assets=null,links=[],notes=[],fcat="",editL=null,editN=null,selIcon=KEYS[0],pics=[];
let ncat="",nsort=(()=>{try{return localStorage.getItem("hubNSort")||"new"}catch(e){return"new"}})();
const openF=new Set();
const FOLDER_IC="M3 6h6l2 2h10v11H3z";
const col=new Intl.Collator(["th","en"],{numeric:true,sensitivity:"base"});
const nkey=n=>(n.title||n.text||"").trim();
const SORTS={new:(a,b)=>(b.ts||0)-(a.ts||0),old:(a,b)=>(a.ts||0)-(b.ts||0),az:(a,b)=>col.compare(nkey(a),nkey(b)),za:(a,b)=>col.compare(nkey(b),nkey(a))};
if(!SORTS[nsort])nsort="new";
const cat=k=>CATS.find(c=>c[0]===k)||CATS[1];
const safeUrl=u=>{u=(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{return new URL(u).href}catch(e){return""}};

function drawChips(){
  const c=$("chips");c.replaceChildren();
  [["","All","#ebe9e4"],...CATS.map(x=>[x[0],x[1],x[2]])].forEach(([k,n,bg])=>{
    const b=E("button",{class:"chip"+(fcat===k?" on":""),text:n,onclick:()=>{fcat=k;drawChips();drawLinks()}});
    if(fcat===k)b.style.background=bg;
    c.append(b)});
}
function drawLinks(){
  const L=$("list");L.replaceChildren();
  const q=$("q").value.trim().toLowerCase();
  const rows=links.filter(x=>(!fcat||x.cat===fcat)&&(!q||(x.name+" "+(x.desc||"")).toLowerCase().includes(q)));
  if(!rows.length){L.append(E("div",{class:"msg",text:links.length?"Nothing found":"No apps yet. Tap + Add to get started."}));return}
  CATS.forEach(([k,n,bg,dot])=>{
    const g=rows.filter(x=>x.cat===k);if(!g.length)return;
    L.append(E("div",{class:"sec"},E("span",{class:"dot",style:"background:"+dot}),E("span",{text:n})));
    const gr=E("div",{class:"grid"});
    g.forEach(x=>{
      gr.append(E("a",{class:"app",href:safeUrl(x.url)||"#",target:"_blank",rel:"noopener",style:"--c:"+bg},
        E("div",{class:"ic"},svg(x.icon)),E("b",{text:x.name}),E("small",{text:x.desc||""}),
        E("button",{class:"ed",text:"✎","aria-label":"Edit",onclick:ev=>{ev.preventDefault();ev.stopPropagation();openL(x)}})))});
    L.append(gr)});
}
function drawNChips(){
  const c=$("nchips");c.replaceChildren();
  [["","All","#ebe9e4"],...CATS.map(x=>[x[0],x[1],x[2]]),["-","No category","#ebe9e4"]].forEach(([k,n,bg])=>{
    const b=E("button",{class:"chip"+(ncat===k?" on":""),text:n,onclick:()=>{ncat=k;drawNChips();drawNotes()}});
    if(ncat===k)b.style.background=bg;
    c.append(b)});
}
const folderNames=()=>[...new Set(notes.map(n=>n.folder).filter(Boolean))].sort(col.compare);
function noteCard(n){
  const c=CATS.find(x=>x[0]===n.cat);
  const d=E("div",{class:"note"+(c?" c":"")});
  if(c)d.style.setProperty("--c",c[2]);

async function hashPin(pin,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error("PIN lock needs a secure (https) connection");
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256)));
}
async function saveLocks(locks){

async function setLock(f,pin){

async function checkPin(f,pin){
  const l=lockOf(f);if(!l)return true;
  if(Date.now()<until)throw new Error("Too many attempts. Try again in "+Math.ceil((until-Date.now())/1000)+"s");
  if(await hashPin(pin,unb64(l.s))===l.h){tries=0;return true}
  if(++tries>=5){tries=0;until=Date.now()+30000}
